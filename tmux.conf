# ~/.tmux.conf — homebase setup
# Reload after edits: prefix + r  (or: tmux source-file ~/.tmux.conf)

# --- Quality of life ---
set -g mouse on                       # click panes/windows, scroll, drag to resize
set -g history-limit 100000           # deep scrollback for long agent output
set -sg escape-time 10                # no lag after pressing Esc (editors, Claude Code)
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"  # true color
# Pass clickable (OSC 8) links through to iTerm2. Without this tmux strips the
# file:// links Claude Code prints, and cmd-click falls back to iTerm guessing
# from the visible text (e.g. "notes.md" → a web domain in the browser).
# Applies to newly attached clients: open a new iTerm window after reloading.
set -as terminal-features ",xterm*:hyperlinks"
set -g set-clipboard on               # mouse-select in tmux → macOS clipboard (via iTerm OSC52)

# --- Numbering: start at 1, keep gaps closed ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Intuitive splits (in addition to default % and ") ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Also rebind the DEFAULT splits: without -c they open in the tmux server's
# start directory, not the current pane's — which would silently drop a pane
# out of ~/work and onto the other Claude account.
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"   # new window keeps current directory

# --- Fast config reload ---
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# --- Theme: calm dark dashboard ---
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-style "bg=#181825,fg=#9399b2"
set -g status-left "#[fg=#181825,bg=#89b4fa,bold] #S #[default]  "
set -g status-right "#[fg=#9399b2]%a %b %d  #[fg=#cdd6f4,bold]%H:%M "
setw -g window-status-current-format "#[fg=#cdd6f4,bold]#I:#W"
setw -g window-status-format "#[fg=#585b70]#I:#W"
set -g window-status-separator "  "
set -g message-style "bg=#89b4fa,fg=#181825,bold"
set -g mode-style "bg=#45475a,fg=#cdd6f4"

# --- Panes: titled borders = the dashboard view ---
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=#89b4fa]#[bold],#[fg=#585b70]}#{pane_index} · #{pane_current_command} #[default]"
set -g pane-border-lines heavy

# --- Keep sessions alive and titles useful ---
set -g set-titles on
set -g set-titles-string "#S:#W"
setw -g automatic-rename on

# --- Copying big output (added 2026-09-17) ---
# Last command's output, however long, via zsh hooks in ~/.zsh/tmux-last-output.zsh
bind y run-shell "$HOME/.local/bin/tmux-last-output -t '#{pane_id}' copy"      # → clipboard
bind Y run-shell "$HOME/.local/bin/tmux-last-output -t '#{pane_id}' file"      # → ~/Downloads/*.txt, opened
bind S run-shell "$HOME/.local/bin/tmux-last-output -t '#{pane_id}' all"       # whole scrollback → clipboard
bind C-s run-shell "$HOME/.local/bin/tmux-last-output -t '#{pane_id}' all-file" # whole scrollback → file

# vi-style copy mode: prefix Enter (or scroll up) to enter; v select, V line,
# C-v block, y yank to macOS clipboard, / ? search, Esc leave.
# Space/Enter still work as before. Revert with: setw -g mode-keys emacs
setw -g mode-keys vi
bind Enter copy-mode
bind / copy-mode \; send-keys ?                       # jump straight into backward search
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi V     send -X select-line
bind -T copy-mode-vi C-v   send -X rectangle-toggle
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel
# Mouse: drag-release, double-click (word) and triple-click (line) auto-copy to
# the macOS clipboard and then clear the selection, same feel as before, but
# through pbcopy instead of OSC52 so multi-thousand-line selections are safe.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel "pbcopy"
bind -n DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send -X select-word ; run-shell -d 0.3 ; send -X copy-pipe-and-cancel "pbcopy" }
bind -n TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send -X select-line ; run-shell -d 0.3 ; send -X copy-pipe-and-cancel "pbcopy" }
